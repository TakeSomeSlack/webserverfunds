<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bird Feeder Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
 
    <style>
        :root {
            --bg:        #0b1120;
            --bg2:       #111927;
            --card:      #141e2e;
            --border:    rgba(255,255,255,0.07);
            --gold:      #f5c842;
            --teal:      #3edfc0;
            --coral:     #ff6b55;
            --text:      #dce8f0;
            --text-dim:  #6b88a0;
            --text-faint:#2e4a5e;
        }
 
        * { box-sizing: border-box; margin: 0; padding: 0; }
 
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
 
        /* simple sky gradient — no noise, no layers */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 70% 40% at 50% 105%, rgba(255,130,40,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 20% 50%, rgba(20,60,80,0.3) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
 
        .page {
            position: relative;
            z-index: 1;
            max-width: 820px;
            margin: 0 auto;
            padding: 0 16px;
        }
 
        /* ── HEADER ── */
        .header {
            padding: 40px 0 24px;
            text-align: center;
        }
 
        .header-icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px rgba(245,200,66,0.4));
        }
 
        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.02em;
            margin-bottom: 4px;
        }
 
        .header-sub {
            font-size: 0.8rem;
            color: var(--text-dim);
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.1em;
        }
 
        /* ── LIVE PILL ── */
        .pill-wrap {
            text-align: center;
            margin: 16px 0 24px;
        }
 
        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(62,223,192,0.07);
            border: 1px solid rgba(62,223,192,0.2);
            border-radius: 99px;
            padding: 5px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.62rem;
            color: var(--teal);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
        }
 
        .live-pill.offline {
            background: rgba(255,107,85,0.07);
            border-color: rgba(255,107,85,0.25);
            color: var(--coral);
        }
 
        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 6px var(--teal);
            animation: blink 2s ease-in-out infinite;
            flex-shrink: 0;
            transition: background 0.3s, box-shadow 0.3s;
        }
 
        .live-pill.offline .live-dot {
            background: var(--coral);
            box-shadow: 0 0 6px var(--coral);
            animation: none;
        }
 
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }
 
        /* ── WARNING ── */
        #warningBox {
            margin: 0 0 16px;
            background: rgba(255,107,85,0.08);
            border: 1px solid rgba(255,107,85,0.25);
            border-left: 3px solid var(--coral);
            color: #ffb5a5;
            padding: 11px 16px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-family: 'Space Mono', monospace;
        }
 
        #warningBox.hidden { display: none; }
 
        /* ── LAYOUT ── */
        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-bottom: 24px;
        }
 
        /* ── CARDS ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            transition: border-color 0.2s;
        }
 
        .card:hover {
            border-color: rgba(255,255,255,0.12);
        }
 
        .card-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--text-faint);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
 
        .label-dot {
            width: 4px; height: 4px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 5px var(--gold);
        }
 
        .label-dot.teal {
            background: var(--teal);
            box-shadow: 0 0 5px var(--teal);
        }
 
        /* ── STATUS CARD ── */
        .card-status {
            grid-column: 1;
            grid-row: 1 / 3;
        }
 
        .stat-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            transition: border-color 0.2s;
        }
 
        .stat-row:last-child { margin-bottom: 0; }
        .stat-row:hover { border-color: rgba(245,200,66,0.15); }
 
        .stat-icon { font-size: 1.2rem; flex-shrink: 0; }
 
        .stat-info { flex: 1; min-width: 0; }
 
        .stat-name {
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-faint);
            margin-bottom: 2px;
        }
 
        .stat-val {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
        }
 
        .batt-bar {
            margin-top: 5px;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 99px;
            overflow: hidden;
        }
 
        .batt-fill {
            height: 100%;
            border-radius: 99px;
            transition: width 0.8s ease;
        }
 
        /* ── VIDEO CARD ── */
        .card-video {
            grid-column: 2;
            grid-row: 1;
            padding: 14px;
        }
 
        .card-video video {
            width: 100%;
            border-radius: 8px;
            display: block;
            background: #000;
        }
 
        .no-video {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 32px 16px;
            color: var(--text-faint);
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            text-align: center;
        }
 
        .no-video span { font-size: 2rem; }
 
        /* ── ACTIONS CARD ── */
        .card-actions {
            grid-column: 2;
            grid-row: 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
 
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 0.82rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.12s, filter 0.15s;
            text-decoration: none;
        }
 
        .btn:hover  { transform: translateY(-1px); filter: brightness(1.1); }
        .btn:active { transform: scale(0.97); }
 
        .btn-feed {
            background: linear-gradient(135deg, #c47800, #f5a800);
            color: #2a1500;
            box-shadow: 0 3px 14px rgba(245,168,0,0.25);
        }
 
        .btn-refresh {
            background: linear-gradient(135deg, #006b55, #00b890);
            color: #001a14;
            box-shadow: 0 3px 14px rgba(0,184,144,0.2);
        }
 
        .btn-gallery {
            background: linear-gradient(135deg, #7a2800, #c04820);
            color: #1a0800;
            box-shadow: 0 3px 14px rgba(192,72,32,0.2);
        }
 
        /* ── LOADING ── */
        .loading {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-faint);
            text-align: center;
            padding: 16px;
            animation: pulse 1.5s ease-in-out infinite;
        }
 
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50%       { opacity: 1; }
        }
 
        /* ── FOOTER ── */
        .footer {
            text-align: center;
            padding: 8px 0 28px;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            color: var(--text-faint);
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }
 
        /* ── RESPONSIVE ── */
        @media (max-width: 520px) {
            .layout { grid-template-columns: 1fr; }
            .card-status, .card-video, .card-actions { grid-column: 1; grid-row: auto; }
            .card-actions { flex-direction: row; }
            .btn { flex: 1; font-size: 0.75rem; }
        }
    </style>
</head>
 
<body>
 
<div class="page">
 
    <!-- HEADER -->
    <div class="header">
        <span class="header-icon">🐦</span>
        <h1>Bird Feeder</h1>
        <p class="header-sub">Garden Monitor · Live</p>
    </div>
 
    <!-- LIVE PILL -->
    <div class="pill-wrap">
        <div class="live-pill" id="livePill">
            <span class="live-dot" id="liveDot"></span>
            <span id="pillText">feeder active</span>
        </div>
    </div>
 
    <!-- WARNING -->
    <div id="warningBox" class="hidden">⚠ <span id="warningText"></span></div>
 
    <!-- GRID -->
    <div class="layout">
 
        <!-- STATUS -->
        <div class="card card-status">
            <div class="card-label"><span class="label-dot"></span> Feeder Status</div>
            <div id="data"><div class="loading">— loading status —</div></div>
        </div>
 
        <!-- VIDEO -->
        <div class="card card-video">
            <div class="card-label"><span class="label-dot teal"></span> Latest Footage</div>
            <div id="videoBox">
                <div class="no-video"><span>🎥</span>Waiting for visitors…</div>
            </div>
        </div>
 
        <!-- ACTIONS -->
        <div class="card card-actions">
            <div class="card-label"><span class="label-dot"></span> Controls</div>
            <button class="btn btn-feed" onclick="sendCommand('F')">🌾 Dispense Feed</button>
            <button class="btn btn-refresh" onclick="refreshStatus()">🔄 Refresh Status</button>
            <a href="gallery.php" style="text-decoration:none;">
                <button class="btn btn-gallery">🎞 Video Gallery</button>
            </a>
        </div>
 
    </div>
 
    <div class="footer">🐦 Bird Feeder Station · Live</div>
 
</div>
 
<script>
 
let lastVideo = "";
let lastTimestamp = "";
 
function showWarning(msg) {
    const warningBox = document.getElementById("warningBox");
    warningBox.classList.remove("hidden");
    document.getElementById("warningText").innerText = msg;
}
 
function clearWarning() {
    document.getElementById("warningBox").classList.add("hidden");
}
 
function setPillOnline() {
    document.getElementById("livePill").classList.remove("offline");
    document.getElementById("pillText").innerText = "feeder active";
}
 
function setPillOffline() {
    document.getElementById("livePill").classList.add("offline");
    document.getElementById("pillText").innerText = "feeder offline";
}
 
function renderStatus(data) {
    const batt = parseInt(data.battery) || 0;
    const battColor = batt > 50 ? '#3edfc0' : batt > 20 ? '#f5c842' : '#ff6b55';
    const battGlow  = batt > 50 ? 'rgba(62,223,192,0.5)' : batt > 20 ? 'rgba(245,200,66,0.5)' : 'rgba(255,107,85,0.5)';
 
    document.getElementById("data").innerHTML = `
        <div class="stat-row">
            <span class="stat-icon">🐦</span>
            <div class="stat-info">
                <div class="stat-name">Bird detected</div>
                <div class="stat-val">${data.bird}</div>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-icon">🫙</span>
            <div class="stat-info">
                <div class="stat-name">Tray</div>
                <div class="stat-val">${data.tray}</div>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-icon">📦</span>
            <div class="stat-info">
                <div class="stat-name">Bin</div>
                <div class="stat-val">${data.bin}</div>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-icon">🔋</span>
            <div class="stat-info">
                <div class="stat-name">Battery</div>
                <div class="stat-val" style="color:${battColor};text-shadow:0 0 8px ${battGlow}">${batt}%</div>
                <div class="batt-bar">
                    <div class="batt-fill" style="width:${batt}%;background:${battColor};box-shadow:0 0 6px ${battGlow}"></div>
                </div>
            </div>
        </div>
        <div class="stat-row">
            <span class="stat-icon">🕐</span>
            <div class="stat-info">
                <div class="stat-name">Last update</div>
                <div class="stat-val" style="font-size:0.8rem">${data.time}</div>
            </div>
        </div>
    `;
}
 
function renderOffline() {
    document.getElementById("data").innerHTML = `
        <div class="stat-row" style="opacity:0.4">
            <span class="stat-icon">🐦</span>
            <div class="stat-info"><div class="stat-name">Bird detected</div><div class="stat-val" style="color:var(--text-faint)">—</div></div>
        </div>
        <div class="stat-row" style="opacity:0.4">
            <span class="stat-icon">🫙</span>
            <div class="stat-info"><div class="stat-name">Tray</div><div class="stat-val" style="color:var(--text-faint)">—</div></div>
        </div>
        <div class="stat-row" style="opacity:0.4">
            <span class="stat-icon">📦</span>
            <div class="stat-info"><div class="stat-name">Bin</div><div class="stat-val" style="color:var(--text-faint)">—</div></div>
        </div>
        <div class="stat-row" style="opacity:0.4">
            <span class="stat-icon">🔋</span>
            <div class="stat-info"><div class="stat-name">Battery</div><div class="stat-val" style="color:var(--text-faint)">—</div><div class="batt-bar"><div class="batt-fill" style="width:0%"></div></div></div>
        </div>
        <div class="stat-row" style="border-color:rgba(255,107,85,0.2);background:rgba(255,107,85,0.04)">
            <span class="stat-icon">📡</span>
            <div class="stat-info">
                <div class="stat-name" style="color:var(--coral)">Feeder status</div>
                <div class="stat-val" style="color:var(--coral);font-size:0.8rem">Not responding</div>
            </div>
        </div>
    `;
}
 
// ==========================
// LOAD DATA
// ==========================
async function loadData(updateVideo=false, checkConnection=false) {
    let res = await fetch("get_data.php?t=" + Date.now());
    let data = await res.json();
 
    if (checkConnection) {
        if (data.time === lastTimestamp) {
            showWarning("⚠️ Cannot connect to feeder — it may be offline or not on WiFi");
            setPillOffline();
            renderOffline();
            return;
        } else {
            if (document.getElementById("warningText").innerText.includes("Cannot connect")) {
                clearWarning();
            }
            setPillOnline();
        }
    }
 
    lastTimestamp = data.time;
 
    if (data.warning !== "") {
        showWarning(data.warning);
    } else {
        clearWarning();
    }
 
    renderStatus(data);
 
    if (data.filename && (updateVideo || data.filename !== lastVideo)) {
        lastVideo = data.filename;
        document.getElementById("videoBox").innerHTML = `
            <video controls>
                <source src="/uploads/${data.filename}">
            </video>
        `;
    }
}
 
// ==========================
// SEND COMMAND
// ==========================
function sendCommand(cmd) {
    fetch("send_command.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "cmd=" + cmd
    });
}
 
// ==========================
// REFRESH (WAKE + GET STATUS)
// ==========================
function refreshStatus() {
    sendCommand("W");
    setTimeout(() => {
        sendCommand("G");
        setTimeout(() => {
            loadData(true, true);
        }, 3000);
    }, 2000);
}
 
// INITIAL LOAD
loadData(true);
 
</script>
 
</body>
</html>
